services:
  db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: mfa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mfa
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mfa"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: docker.io/library/redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    image: localhost/mk2fa-api:latest
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://mfa:${POSTGRES_PASSWORD}@db:5432/mfa
      REDIS_URL: redis://redis:6379/0
      SSL_DATA_DIR: /data/ssl
    volumes:
      - ssl_certs:/data/ssl
      - ./.env:/run/mk2fa/host.env:ro,z
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    image: localhost/mk2fa-api:latest
    command: celery -A app.celery_app worker --loglevel=info -Q default -n worker-default@%h
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://mfa:${POSTGRES_PASSWORD}@db:5432/mfa
      REDIS_URL: redis://redis:6379/0
      SSL_DATA_DIR: /data/ssl
    volumes:
      - ssl_certs:/data/ssl
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app inspect ping 2>/dev/null | grep -q OK"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  worker-otp:
    image: localhost/mk2fa-api:latest
    command: celery -A app.celery_app worker --loglevel=info -Q otp -n worker-otp@%h
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://mfa:${POSTGRES_PASSWORD}@db:5432/mfa
      REDIS_URL: redis://redis:6379/0
      SSL_DATA_DIR: /data/ssl
    volumes:
      - ssl_certs:/data/ssl
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app inspect ping 2>/dev/null | grep -q OK"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  beat:
    image: localhost/mk2fa-api:latest
    command: celery -A app.celery_app beat --loglevel=info
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://mfa:${POSTGRES_PASSWORD}@db:5432/mfa
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  radius:
    build: ./radius
    env_file: .env
    environment:
      API_URL: http://api:8000
    volumes:
      - ./.env:/run/mk2fa/host.env:ro,z
    ports:
      - "1812:1812/udp"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f server.py"]
      interval: 20s
      timeout: 5s
      retries: 5

  web:
    build: ./web
    volumes:
      - ssl_certs:/etc/nginx/ssl
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --no-check-certificate https://127.0.0.1/health | grep -q ok"]
      interval: 20s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  ssl_certs:
